services:
  mysql:
    # docker sẽ pull image về nếu chưa có
    # docker pull mysql:8.4.8-oraclelinux9
    image: mysql:8.4.8-oraclelinux9
    container_name: naho-mysql
    # nếu container chết, docker sẽ tự khởi động lại
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # lần đầu khởi động tự tạo db naho
      MYSQL_DATABASE: naho

      # mysql tự tạo user và password
      MYSQL_USER: naho_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # máy host là 3307, container là 3306
    ports:
      - "3307:3306"
    # toàn bộ dữ liệu nằm ở /var/lib/mysql
    volumes:
      - mysql_data:/var/lib/mysql

  # redis
  redis:
    image: redis:8.8.0
    container_name: naho-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    # redis sẽ lưu dữ liệu tại /data
    volumes:
      - redis_data:/data

  # spring boot app
  backend:
    build:
      context: .
    container_name: naho-backend
    restart: unless-stopped
    ports:
      - "8386:8386"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:mysql://mysql:3306/naho?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      DB_USERNAME: naho_user
      DB_PASSWORD: ${MYSQL_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 0

      JWT_SECRET: ${JWT_SECRET}

      OPENAI_API_KEY: ${OPENAI_API_KEY}

      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}

    depends_on:
      - mysql
      - redis

# khai báo volumes, docker sẽ tạo mysql_data và redis_data
volumes:
  mysql_data:
  redis_data: