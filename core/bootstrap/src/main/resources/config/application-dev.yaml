spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/naho?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

azure:
  speech:
    subscription-key: ${AZURE_SPEECH_KEY}
    region: ${AZURE_SPEECH_REGION}
    language: "ja-JP"

openai:
  api-key: ${OPENAI_API_KEY}
  chat-model: ${OPENAI_CHAT_MODEL:gpt-4.1-mini}
  scoring-model: ${OPENAI_SCORING_MODEL:gpt-4o}
  max-tokens: ${OPENAI_MAX_TOKENS:1000}
  temperature: ${OPENAI_TEMPERATURE:0.7}