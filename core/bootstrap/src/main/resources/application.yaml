spring:
  application:
    name: naho-be

  profiles:
    active: dev

  config:
    import:
      - optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  data:
    redis:
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2s

    web:
      pageable:
        one-indexed-parameters: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 1000
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}

server:
  port: 8386

logging:
  config: classpath:log-config/log4j2-spring.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs

mybatis:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml

app:
  frontend-url: ${FRONTEND_URL}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 5m
    refresh-token-expiration: 14d

  openai:
    api-key: ${LLM_API_KEY}
    chat-model: gpt-4.1-mini
    scoring-model: gpt-4o
    max-tokens: 1000
    temperature: 0.7

  azure:
    subscription-key: ${AZURE_SPEECH_KEY}
    region: japaneast
    language: ja-JP
  s3:
    bucket-name: naho-bucket
    region: ap-southeast-1

