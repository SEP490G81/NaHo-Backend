spring:
  application:
    name: naho-be

  profiles:
    active: dev

  config:
    import:
      - optional:file:.env[.properties]

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  data:
    redis:
      timeout: 3s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2s

    web:
      pageable:
        one-indexed-parameters: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        jdbc:
          batch_size: 1000
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${CLIENT_ID}
            client-secret: ${CLIENT_SECRET}

server:
  port: 8386

logging:
  config: classpath:log-config/log4j2-spring.xml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    url: /v3/api-docs

mybatis:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml

app:
  frontend-url: ${FRONTEND_URL}
  nextjs-server-files-api: ${NEXTJS_SERVER_FILES_API}
  scheduler:
    file-upload-retry:
      fixed-delay: 60000
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 5m
    refresh-token-expiration: 14d

  openai:
    api-key: ${LLM_API_KEY}
    admin-api-key: ${LLM_ADMIN_API_KEY}
    chat-model: gpt-4o-mini
    scoring-model: gpt-4o
    max-tokens: 10000
    temperature: 0.7

  azure:
    subscription-key: ${AZURE_SPEECH_KEY}
    region: japaneast
    language: ja-JP
    cost:
      tenant-id: ${AZURE_TENANT_ID}
      client-id: ${AZURE_CLIENT_ID}
      client-secret: ${AZURE_CLIENT_SECRET}
      subscription-id: ${AZURE_SUBSCRIPTION_ID}
      scope: ${AZURE_COST_SCOPE:https://management.azure.com/.default}
      query-url-template: ${AZURE_COST_QUERY_URL_TEMPLATE:https://management.azure.com/subscriptions/%s/providers/Microsoft.CostManagement/query?api-version=2025-03-01}

  s3:
    public-bucket-name: naho-public-bucket
    private-bucket-name: naho-private-bucket
    region: ap-southeast-1
    signatureDuration: 5m

  vnpay:
    tmn-code: AS09APAU
    hash-secret: ${VNPAY_SECRET_KEY}
    payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: https://groggily-override-wrongly.ngrok-free.dev/api/v1/payments/vnpay-return
    timeout: 5

  static-resource:
    local-root: ${LOCAL_ROOT}
    local-path: ${LOCAL_PATH}
    backend-files-base-url: ${BACKEND_FILES_BASE_URL}
