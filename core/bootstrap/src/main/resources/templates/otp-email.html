<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mã xác nhận OTP - NaHo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #0d6efd;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .content {
            padding: 30px;
            text-align: center;
        }
        .content p {
            font-size: 16px;
            line-height: 1.5;
            color: #555;
        }
        .otp-box {
            margin: 30px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border: 2px dashed #0d6efd;
            display: inline-block;
            border-radius: 8px;
            font-size: 32px;
            font-weight: bold;
            color: #0d6efd;
            letter-spacing: 5px;
        }
        .footer {
            background-color: #f1f1f1;
            padding: 15px;
            text-align: center;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Xác nhận tài khoản NaHo</h1>
    </div>
    <div class="content">
        <p>Chào bạn,</p>
        <p>Bạn đã yêu cầu đăng nhập/đăng ký vào ứng dụng NaHo. Đây là mã OTP xác thực email của bạn:</p>
        <div class="otp-box" th:text="${otpCode}">123456</div>
        <p>Mã này có hiệu lực trong vòng <strong>5 phút</strong>.</p>
        <p>Vui lòng không chia sẻ mã này cho bất kỳ ai.</p>
    </div>
    <div class="footer">
        &copy; 2026 NaHo App. All rights reserved.
    </div>
</div>
</body>
</html>
